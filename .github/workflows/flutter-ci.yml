name: 🔬 Flutter CI — Analyze, Test, Build Check

on:
  push:
    branches: [main, develop, 'claude/**', 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # ─── ANALYZE & TEST ───────────────────────────────────────────────────────────
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Dart format kontrolü
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Flutter analizi
        run: flutter analyze --no-fatal-infos

      - name: Testleri çalıştır
        run: flutter test --coverage

      - name: Coverage raporu yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 7

  # ─── BUILD WEB ────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Web build (CanvasKit)
        run: |
          flutter build web --release \
            --web-renderer canvaskit \
            --dart-define=GEMINI_API_KEY=PLACEHOLDER_FOR_CI

      - name: Web build boyutunu raporla
        run: |
          echo "### 📦 Web Build Boyutu" >> $GITHUB_STEP_SUMMARY
          du -sh build/web >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Dosya | Boyut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          find build/web -name "*.js" -exec du -sh {} \; | sort -rh | head -5 | \
            awk '{print "| " $2 " | " $1 " |"}' >> $GITHUB_STEP_SUMMARY

  # ─── BUILD ANDROID (sadece main/develop) ──────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Debug APK build (signing olmadan)
        run: flutter build apk --debug

      - name: APK boyutu
        run: |
          echo "### 📱 Android APK Boyutu" >> $GITHUB_STEP_SUMMARY
          du -sh build/app/outputs/flutter-apk/app-debug.apk >> $GITHUB_STEP_SUMMARY
