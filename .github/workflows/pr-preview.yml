name: 🔍 PR Preview — Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  preview:
    name: Build & Deploy PR Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Flutter analizi (PR için)
        run: flutter analyze --no-fatal-infos

      - name: Web build
        run: |
          flutter build web --release \
            --web-renderer canvaskit \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Cloudflare Pages preview deploy
        id: cf-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=nefes-app --branch=pr-${{ github.event.pull_request.number }}

      - name: PR'a preview URL yaz
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://pr-${prNumber}.nefes-app.pages.dev`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 PR Preview Hazır\n\n| | |\n|---|---|\n| **Preview URL** | ${previewUrl} |\n| **Commit** | \`${sha}\` |\n| **Branch** | \`${{ github.head_ref }}\` |\n\n> Flutter Web (CanvasKit) — Cloudflare Pages`
            });
